{% assign giscus_ready = false %}
{% if site.giscus.repo_id and site.giscus.repo_id != "" %}{% if site.giscus.category_id and site.giscus.category_id != "" %}{% assign giscus_ready = true %}{% endif %}{% endif %}
{% if giscus_ready %}
<section class="comments" aria-label="Comments">
  <script>
    (function () {
      var theme = document.documentElement.getAttribute("data-theme") || "preferred_color_scheme";
      var s = document.createElement("script");
      s.src = "https://giscus.app/client.js";
      s.async = true;
      s.crossOrigin = "anonymous";
      var attrs = {
        "data-repo": "{{ site.giscus.repo }}",
        "data-repo-id": "{{ site.giscus.repo_id }}",
        "data-category": "{{ site.giscus.category }}",
        "data-category-id": "{{ site.giscus.category_id }}",
        "data-mapping": "pathname",
        "data-strict": "1",
        "data-reactions-enabled": "1",
        "data-emit-metadata": "0",
        "data-input-position": "top",
        "data-theme": theme,
        "data-lang": "en",
        "data-loading": "lazy"
      };
      for (var k in attrs) s.setAttribute(k, attrs[k]);
      document.currentScript.parentNode.appendChild(s);
    })();
  </script>
</section>
{% endif %}
